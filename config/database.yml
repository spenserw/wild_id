# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/usr/local/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= ENV.fetch("POSTGRES_USER", "wild_id") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "wild_id") %>

development:
  <<: *default
  database: wild_id_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: wild_id_test

# Production uses the Kamal Postgres accessory (wild_id-db).
# Solid Cache / Queue / Cable each get their own database on the same server.
production:
  primary: &primary_production
    <<: *default
    database: wild_id_production
    username: wild_id
    password: <%= ENV["POSTGRES_PASSWORD"] %>
    host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  cache:
    <<: *primary_production
    database: wild_id_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: wild_id_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: wild_id_production_cable
    migrations_paths: db/cable_migrate
