services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wild_id
      POSTGRES_PASSWORD: wild_id
      POSTGRES_DB: wild_id_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/development.sql:/docker-entrypoint-initdb.d/setup.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wild_id -d wild_id_development"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
